name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

env:
  QT_VERSION: 6.11.1

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "project(Merce VERSION ${version} " CMakeLists.txt
          grep -Fq "## [${version}] - " CHANGELOG.md

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMERCE_BUILD_NOTIFICATIONS=OFF
          -DMERCE_ENABLE_FONTAWESOME=ON
          -DMERCE_BUILD_TESTS=ON
          -DBUILD_MERCE_PLAYGROUND=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Verify install package
        run: |
          cmake --install build --prefix "${RUNNER_TEMP}/merce-install"
          test -s "${RUNNER_TEMP}/merce-install/lib/cmake/Merce/MerceConfig.cmake"
          test -s "${RUNNER_TEMP}/merce-install/lib/cmake/Merce/MerceTargets.cmake"

      - name: Build package consumer
        run: |
          cmake -S tests/package-consumer -B build-package-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${RUNNER_TEMP}/merce-install"
          cmake --build build-package-consumer --parallel 2

      - name: Run package consumer
        env:
          QT_QPA_PLATFORM: offscreen
          QML_IMPORT_PATH: ${{ runner.temp }}/merce-install/lib/qml
          LD_LIBRARY_PATH: ${{ runner.temp }}/merce-install/lib
        run: build-package-consumer/merce_package_consumer

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "Merce ${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --latest
