name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.1

jobs:
  source-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Core
            os: ubuntu-24.04
            notifications: "OFF"
            fontawesome: "OFF"
            playground: "OFF"
            style_effects: "ON"
            rendering: "OFF"
          - name: macOS / Core
            os: macos-15
            notifications: "OFF"
            fontawesome: "OFF"
            playground: "OFF"
            style_effects: "ON"
            rendering: "OFF"
          - name: Ubuntu / Full playground
            os: ubuntu-24.04
            notifications: "ON"
            fontawesome: "ON"
            playground: "ON"
            style_effects: "ON"
            rendering: "ON"
          - name: Ubuntu / Base style
            os: ubuntu-24.04
            notifications: "OFF"
            fontawesome: "OFF"
            playground: "OFF"
            style_effects: "OFF"
            rendering: "OFF"

    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMERCE_BUILD_NOTIFICATIONS=${{ matrix.notifications }}
          -DMERCE_ENABLE_FONTAWESOME=${{ matrix.fontawesome }}
          -DMERCE_BUILD_TESTS=ON
          -DBUILD_TESTING=ON
          -DBUILD_MERCE_PLAYGROUND=${{ matrix.playground }}
          -DMERCE_ENABLE_TOKEN_BUILD=OFF
          -DMERCE_BUILD_STYLE_EFFECTS=${{ matrix.style_effects }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Lint playground
        if: matrix.playground == 'ON'
        run: >-
          cmake --build build
          --config Release
          --target MercePlayground_qmllint

      - name: Test
        run: >-
          ctest --test-dir build
          -C Release
          --output-on-failure
          --no-tests=error
          --timeout 180

      - name: Run playground verification gates
        if: matrix.playground == 'ON'
        env:
          MERCE_BUILD_DIR: build
          MERCE_GALLERY_DIR: ${{ runner.temp }}/merce-gallery
        run: skills/merce-playground-verification/scripts/run-gates.sh

      - name: Install headless OpenGL test dependencies
        if: matrix.rendering == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-dri

      - name: Verify shader pixels and finite hover animation
        if: matrix.rendering == 'ON'
        run: |
          cmake -S . -B build -DMERCE_TEST_EFFECTS_RENDERING=ON
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=rhi \
            QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir build --output-on-failure --timeout 180 \
            -R '^tst_merce_effects_rendering$'

      - name: Export playground with OpenGL effects
        if: matrix.rendering == 'ON'
        run: >-
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=rhi
          QSG_RHI_BACKEND=opengl LIBGL_ALWAYS_SOFTWARE=1
          QML_IMPORT_PATH="$PWD/build/qml"
          build/playground/MercePlayground
          --export-playground-pages "${{ runner.temp }}/merce-effects"

      - name: Upload effects previews
        if: matrix.rendering == 'ON'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merce-effects-opengl
          path: ${{ runner.temp }}/merce-effects/*-effects.png
          if-no-files-found: error

      - name: Verify playground without the adapter
        if: matrix.playground == 'ON'
        run: |
          cmake -S . -B build-without-effects -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMERCE_BUILD_STYLE_EFFECTS=OFF \
            -DMERCE_BUILD_NOTIFICATIONS=ON -DMERCE_ENABLE_FONTAWESOME=ON \
            -DBUILD_MERCE_PLAYGROUND=ON -DMERCE_BUILD_TESTS=OFF
          cmake --build build-without-effects --parallel 2
          QML_IMPORT_PATH="$PWD/build-without-effects/qml" \
            build-without-effects/playground/MercePlayground --playground-probe

  package:
    name: Installed package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: Verify source-tree targets
        run: |
          cmake -S tests/source-consumer -B build-source-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-source-consumer --parallel 2
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            QML_IMPORT_PATH="$PWD/build-source-consumer/merce/qml" \
            build-source-consumer/consumer/merce_package_consumer

      - name: Build and install Merce
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMERCE_BUILD_NOTIFICATIONS=OFF \
            -DMERCE_ENABLE_FONTAWESOME=ON \
            -DMERCE_BUILD_TESTS=OFF \
            -DBUILD_MERCE_PLAYGROUND=OFF
          cmake --build build-install --parallel
          cmake --install build-install --prefix "$RUNNER_TEMP/merce-install"

      - name: Verify installed notices
        run: |
          test -s "$RUNNER_TEMP/merce-install/share/doc/Merce/LICENSE"
          test -s "$RUNNER_TEMP/merce-install/share/doc/Merce/licenses/jetbrains-mono-OFL-1.1.txt"

      - name: Build package consumer
        run: |
          cmake -S tests/package-consumer -B build-package-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/merce-install"
          cmake --build build-package-consumer --parallel

      - name: Run package consumer
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QML_IMPORT_PATH: ${{ runner.temp }}/merce-install/lib/qml
          LD_LIBRARY_PATH: ${{ runner.temp }}/merce-install/lib
        run: build-package-consumer/merce_package_consumer

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/design-tokens/package-lock.json

      - name: Install token tooling
        run: npm --prefix tools/design-tokens ci

      - name: Generate and validate
        run: |
          npm --prefix tools/design-tokens run build
          npm --prefix tools/design-tokens run validate
          npm --prefix tools/design-tokens run check
          git diff --exit-code -- generated tools/design-tokens
